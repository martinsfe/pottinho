name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Conferir arquivos
        run: |
          ls -la
          if [ ! -f settings.gradle ] || [ ! -d app ]; then
            echo "::error::Os arquivos do app precisam ficar soltos na raiz do repositório (app, build.gradle, settings.gradle, gradle.properties). Parece que foram enviados dentro de uma pasta ou faltou algum."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Potinho.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Potinho ${{ github.run_number }}
          body: Baixe o arquivo Potinho.apk abaixo e instale por cima da versão anterior.
          files: Potinho.apk
          make_latest: true
